<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="496" viewBox="0 0 1000 496" role="img" aria-labelledby="title desc">
  <title id="title">Stripe PaymentIntent and order paths</title>
  <desc id="desc">An authenticated payment request reads the Redis basket, refreshes prices and shipping from SQL Server, then creates or updates a Stripe PaymentIntent and saves the basket back to Redis. The separate order request reads the basket intent ID and writes order snapshots. The reviewed API does not confirm payments or consume webhooks.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#293548" opacity=".42" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m1 1 8 4-8 4" fill="none" stroke="#58b9eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .sans { font-family: system-ui, sans-serif; }
    .panel { fill: #131b2b; stroke: #3d6b86; stroke-width: 1.4; }
    .connector { fill: none; stroke: #58b9eb; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>
  <rect width="1000" height="496" fill="#0b0f1c" />
  <rect width="1000" height="496" fill="url(#grid)" />
  <path d="M30 87H970" stroke="#293548" />
  <text class="mono" x="30" y="39" fill="#58b9eb" font-size="19" letter-spacing="1.2">STRIPE / PAYMENTINTENT FLOW</text>
  <text class="sans" x="30" y="69" fill="#94a3b8" font-size="16">Source-verified flow for creating or updating an intent.</text>
  <path class="connector" d="M324 156h54" />
  <path class="connector" d="M621 156h54" />
  <path class="connector" d="M818 190v63" />
  <path class="connector" d="M438 408H498" />
  <g class="sans" text-anchor="middle">
    <rect class="panel" x="37" y="122" width="287" height="68" rx="9" />
    <text x="180.5" y="151" fill="#f1f5f9" font-size="20" font-weight="650">Read Redis basket</text>
    <text x="180.5" y="173" fill="#94a3b8" font-size="15">Authenticated payment request</text>
  </g>
  <g class="sans" text-anchor="middle">
    <rect class="panel" x="378" y="122" width="243" height="68" rx="9" />
    <text x="499.5" y="151" fill="#f1f5f9" font-size="20" font-weight="650">Reprice the basket</text>
    <text x="499.5" y="173" fill="#94a3b8" font-size="15">SQL Server prices and delivery fee</text>
  </g>
  <g class="sans" text-anchor="middle">
    <rect class="panel" x="675" y="122" width="287" height="68" rx="9" />
    <text x="818.5" y="151" fill="#f1f5f9" font-size="20" font-weight="650">Send amount to Stripe</text>
    <text x="818.5" y="173" fill="#94a3b8" font-size="15">Create or update a USD card intent</text>
  </g>
  <g class="sans" text-anchor="middle">
    <rect class="panel" x="675" y="253" width="287" height="68" rx="9" />
    <text x="818.5" y="282" fill="#f1f5f9" font-size="20" font-weight="650">Save basket in Redis</text>
    <text x="818.5" y="304" fill="#94a3b8" font-size="15">Store the intent ID and return the DTO</text>
  </g>
  <path d="M37 342H962" stroke="#293548" />
  <text class="mono" x="37" y="363" fill="#58b9eb" font-size="15" letter-spacing="1">SEPARATE ORDER REQUEST</text>
  <g class="sans" text-anchor="middle">
    <rect class="panel" x="37" y="374" width="401" height="68" rx="9" />
    <text x="237.5" y="403" fill="#f1f5f9" font-size="20" font-weight="650">Read the basket intent ID</text>
    <text x="237.5" y="425" fill="#94a3b8" font-size="15">Required by the order service</text>
  </g>
  <g class="sans" text-anchor="middle">
    <rect class="panel" x="498" y="374" width="464" height="68" rx="9" />
    <text x="730" y="403" fill="#f1f5f9" font-size="20" font-weight="650">Persist order and item snapshots</text>
    <text x="730" y="425" fill="#94a3b8" font-size="15">An intent ID does not establish payment settlement</text>
  </g>
</svg>
