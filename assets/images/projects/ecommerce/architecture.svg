    <text x="500" y="239" fill="#f1f5f9" font-size="20" font-weight="650">ECommerce.Web</text>
    <text x="500" y="261" fill="#94a3b8" font-size="15">Presentation · Web API host</text>
  </g>
  <g class="sans" text-anchor="middle">
    <rect class="panel" x="74" y="326" width="336" height="68" rx="9" />
    <text x="242" y="355" fill="#f1f5f9" font-size="20" font-weight="650">ECommerce.Persistance</text>
    <text x="242" y="377" fill="#94a3b8" font-size="15">Infrastructure · EF Core and Redis adapters</text>
  </g>
  <g class="sans" text-anchor="middle">
    <rect class="panel" x="590" y="326" width="336" height="68" rx="9" />
    <text x="758" y="355" fill="#f1f5f9" font-size="20" font-weight="650">ECommerce.Presentation</text>
