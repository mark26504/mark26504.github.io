<svg xmlns="http://www.w3.org/2000/svg" width="800" height="535" viewBox="0 0 800 535" role="img" aria-labelledby="title desc">
  <title id="title">Gym Management System project references and runtime storage</title>
  <desc id="desc">The MVC presentation project references the business logic project, which references the data access project. The data access layer uses SQL Server at runtime.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#293548" opacity=".42" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m1 1 8 4-8 4" fill="none" stroke="#58b9eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .sans { font-family: system-ui, sans-serif; }
    .panel { fill: #131b2b; stroke: #3d6b86; stroke-width: 1.4; }
    .connector { fill: none; stroke: #58b9eb; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
    .runtime { stroke-dasharray: 6 5; }
    .key { font-size: 12px; font-weight: 700; }
    .field { fill: #f1f5f9; font-size: 16px; }
  </style>
  <rect width="800" height="535" fill="#0b0f1c" />
  <rect width="800" height="535" fill="url(#grid)" />
  <path d="M28 87H772" stroke="#293548" />
  <text class="mono" x="28" y="39" fill="#58b9eb" font-size="19" letter-spacing="1.2">GYM MANAGEMENT SYSTEM / THREE TIERS</text>
  <text class="sans" x="28" y="69" fill="#94a3b8" font-size="16">Solid arrows show direct project references. The dashed arrow shows runtime database access.</text>
  <path class="connector" d="M400 184v30" />
  <path class="connector" d="M400 288v30" />
  <path class="connector runtime" d="M400 392v40" />
  <g class="sans" text-anchor="middle">
    <rect class="panel" x="131" y="110" width="538" height="74" rx="9" />
    <text x="400" y="140" fill="#f1f5f9" font-size="22" font-weight="650">GymManagementSystemPL</text>
    <text x="400" y="164" fill="#94a3b8" font-size="16">Presentation · MVC controllers, Razor views, and application startup</text>
    <rect class="panel" x="131" y="214" width="538" height="74" rx="9" />
    <text x="400" y="244" fill="#f1f5f9" font-size="22" font-weight="650">GymManagementSystemBLL</text>
    <text x="400" y="268" fill="#94a3b8" font-size="16">Business logic · Services, rules, ViewModels, and AutoMapper</text>
    <rect class="panel" x="131" y="318" width="538" height="74" rx="9" />
    <text x="400" y="348" fill="#f1f5f9" font-size="22" font-weight="650">GymManagementSystemDAL</text>
    <text x="400" y="372" fill="#94a3b8" font-size="16">Data access · Entities, repositories, EF Core, and migrations</text>
    <rect class="panel" x="131" y="432" width="538" height="74" rx="9" />
    <text x="400" y="462" fill="#f1f5f9" font-size="22" font-weight="650">SQL Server</text>
    <text x="400" y="486" fill="#94a3b8" font-size="16">Runtime storage · Gym operations and Identity in one database</text>
  </g>
</svg>
