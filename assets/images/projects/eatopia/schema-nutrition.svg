<svg xmlns="http://www.w3.org/2000/svg" width="960" height="775" viewBox="0 0 960 775" role="img" aria-labelledby="title desc">
  <title id="title">Nutrition and diet plans</title>
  <desc id="desc">Nutrition and diet plans. Tables and columns from migrations, repair SQL, and EF model. Solid arrows are migration foreign keys. Dashed arrows are EF mappings without a corresponding public DDL constraint.</desc>
