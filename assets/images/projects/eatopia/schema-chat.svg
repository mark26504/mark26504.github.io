<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" role="img" aria-labelledby="title desc">
  <title id="title">Chat and messaging</title>
  <desc id="desc">Chat and messaging. Tables and columns from migrations, repair SQL, and EF model. Solid arrows are migration foreign keys. Dashed arrows are EF mappings without a corresponding public DDL constraint.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#293548" opacity=".36" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#58b9eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .sans { font-family: system-ui, sans-serif; }
    .panel { fill: #131b2b; stroke: #345570; stroke-width: 1.4; }
    .row { font-size: 17px; fill: #f1f5f9; }
    .key { font-size: 13px; font-weight: 700; }
    .relation { font-size: 15px; fill: #58b9eb; }
    .connector { fill: none; stroke: #58b9eb; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect width="960" height="830" fill="#0b0f1c" />
  <rect width="960" height="830" fill="url(#grid)" />
  <path d="M28 104H932" stroke="#293548" />
  <text class="mono" x="28" y="32" fill="#58b9eb" font-size="17" letter-spacing="1.25">EATOPIA / SQL SERVER</text>
  <text class="sans" x="28" y="69" fill="#f1f5f9" font-size="31" font-weight="700">Chat and messaging</text>
  <text class="sans" x="28" y="93" fill="#94a3b8" font-size="15">3 tables · Columns and key references</text>
  <g aria-label="ChatThreads">
    <rect class="panel" x="28" y="126" width="442" height="211" rx="9" />
    <path d="M29 168V135q0-8 8-8h424q8 0 8 8v33z" fill="#1b3043" />
    <text class="mono" x="43" y="154" fill="#58b9eb" font-weight="700" font-size="20">ChatThreads</text>
    <text class="mono key" x="43" y="189" fill="#f4ca78">PK</text>
    <text class="mono row" x="77" y="189">Id</text>
    <text class="mono row" x="77" y="215">CreatedAt</text>
    <text class="mono row" x="77" y="241">RequestStatus</text>
    <text class="mono row" x="77" y="267">RequestedByUserId</text>
    <text class="mono row" x="77" y="293">AcceptedAt</text>
    <text class="mono row" x="77" y="319">DeletedAt</text>
  </g>
  <g aria-label="ChatParticipants">
    <rect class="panel" x="490" y="126" width="442" height="185" rx="9" />
    <path d="M491 168V135q0-8 8-8h424q8 0 8 8v33z" fill="#1b3043" />
    <text class="mono" x="505" y="154" fill="#58b9eb" font-weight="700" font-size="20">ChatParticipants</text>
    <text class="mono key" x="505" y="189" fill="#f4ca78">PK</text>
    <text class="mono row" x="539" y="189">Id</text>
    <text class="mono key" x="505" y="215" fill="#58b9eb">FK</text>
    <text class="mono row" x="539" y="215">ThreadId</text>
    <path class="connector" d="M630 210H780" />
    <text class="mono relation" text-anchor="end" x="918" y="215">ChatThreads.Id</text>
    <text class="mono key" x="505" y="241" fill="#58b9eb">FK</text>
    <text class="mono row" x="539" y="241">UserId</text>
    <path class="connector" d="M610 236H835" />
    <text class="mono relation" text-anchor="end" x="918" y="241">Users.Id</text>
    <text class="mono row" x="539" y="267">JoinedAt</text>
    <text class="mono row" x="539" y="293">CreatedAt</text>
  </g>
  <g aria-label="ChatMessages">
    <rect class="panel" x="490" y="331" width="442" height="419" rx="9" />
    <path d="M491 373V340q0-8 8-8h424q8 0 8 8v33z" fill="#1b3043" />
    <text class="mono" x="505" y="359" fill="#58b9eb" font-weight="700" font-size="20">ChatMessages</text>
    <text class="mono key" x="505" y="394" fill="#f4ca78">PK</text>
    <text class="mono row" x="539" y="394">Id</text>
    <text class="mono key" x="505" y="420" fill="#58b9eb">FK</text>
    <text class="mono row" x="539" y="420">ThreadId</text>
    <path class="connector" d="M630 415H780" />
    <text class="mono relation" text-anchor="end" x="918" y="420">ChatThreads.Id</text>
    <text class="mono key" x="505" y="446" fill="#58b9eb">FK</text>
    <text class="mono row" x="539" y="446">SenderId</text>
    <path class="connector" d="M630 441H835" />
    <text class="mono relation" text-anchor="end" x="918" y="446">Users.Id</text>
    <text class="mono row" x="539" y="472">MessageText</text>
    <text class="mono row" x="539" y="498">MessageType</text>
    <text class="mono row" x="539" y="524">MediaContent</text>
    <text class="mono row" x="539" y="550">FileName</text>
    <text class="mono row" x="539" y="576">SentAt</text>
    <text class="mono row" x="539" y="602">IsDeleted</text>
    <text class="mono row" x="539" y="628">EditedAt</text>
    <text class="mono row" x="539" y="654">DeletedAt</text>
    <text class="mono row" x="539" y="680">CreatedAt</text>
    <text class="mono row" x="539" y="706">DeliveredAt</text>
    <text class="mono row" x="539" y="732">SeenAt</text>
  </g>
  <path d="M28 779h904" stroke="#293548" />
  <text class="mono" x="28" y="808" font-size="15" fill="#f4ca78">PK  Primary key</text>
  <text class="mono" x="240" y="808" font-size="15" fill="#58b9eb">FK  Migration constraint</text>
  <text class="mono" x="540" y="808" font-size="15" fill="#58b9eb">EF  Model mapping only</text>
</svg>
