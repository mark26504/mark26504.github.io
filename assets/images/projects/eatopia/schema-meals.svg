  <path d="M28 831h904" stroke="#293548" />
  <text class="mono" x="28" y="860" font-size="15" fill="#f4ca78">PK  Primary key</text>
  <text class="mono" x="240" y="860" font-size="15" fill="#58b9eb">FK  Migration constraint</text>
  <text class="mono" x="540" y="860" font-size="15" fill="#58b9eb">EF  Model mapping only</text>
